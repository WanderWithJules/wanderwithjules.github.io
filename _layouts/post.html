---
layout: default
---

<article class="post">

  {% if page.image %}
    <img
      src="{{ page.image | relative_url }}"
      alt="{{ page.title }}"
      style="width:100%;max-height:550px;object-fit:cover;border-radius:8px;margin-bottom:30px;">
  {% endif %}

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>

    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
